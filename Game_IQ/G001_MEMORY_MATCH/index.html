
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - Lật thẻ tìm cặp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 25px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #334155;
            margin: 0 0 20px;
            font-size: 28px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #eff6ff;
            border-radius: 12px;
            padding: 12px 5px;
        }

        .stat-label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #2563eb;
            font-size: 23px;
            font-weight: bold;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px auto;
            max-width: 500px;
        }

        .card {
            aspect-ratio: 1 / 1;
            cursor: pointer;
            perspective: 800px;
            user-select: none;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.45s;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Mặt úp: chỉ có một dấu hỏi từ HTML */
        .card-front {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            color: white;
            font-size: clamp(25px, 6vw, 42px);
            font-weight: bold;
            border: 3px solid #bfdbfe;
        }

        /* Mặt có hình */
        .card-back {
            background: linear-gradient(145deg, #fef3c7, #fde68a);
            transform: rotateY(180deg);
            font-size: clamp(30px, 7vw, 48px);
            border: 3px solid #fbbf24;
        }

        .card.matched .card-back {
            background: #dcfce7;
            border-color: #22c55e;
            cursor: default;
        }

        .card:not(.matched):hover {
            transform: scale(1.03);
        }

        .message {
            min-height: 28px;
            margin: 15px 0;
            color: #475569;
            font-size: 16px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #restartBtn {
            background: #2563eb;
            color: white;
        }

        #soundBtn {
            background: #e0f2fe;
            color: #0369a1;
        }

        /* Hộp kết quả */
        .result-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: white;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            text-align: center;
            animation: appear 0.3s ease;
        }

        .result-content h2 {
            color: #16a34a;
            margin-top: 0;
        }

        #finalResult {
            line-height: 1.8;
            color: #334155;
        }

        #playAgainBtn {
            background: #16a34a;
            color: white;
            margin-top: 10px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .game-container {
                padding: 15px;
            }

            h1 {
                font-size: 23px;
            }

            .game-board {
                gap: 8px;
            }

            .card-front,
            .card-back {
                border-radius: 10px;
            }

            button {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="game-container">

        <h1>🧠 MEMORY MATCH</h1>

        <div class="stats">

            <div class="stat-box">
                <div class="stat-label">ĐIỂM SỐ</div>
                <div class="stat-value" id="score">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">SỐ LƯỢT</div>
                <div class="stat-value" id="moves">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">THỜI GIAN</div>
                <div class="stat-value" id="timer">00:00</div>
            </div>

        </div>

        <div class="message" id="message">
            Hãy tìm các cặp hình giống nhau!
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="controls">

            <button id="restartBtn">
                🔄 Chơi lại
            </button>

            <button id="soundBtn">
                🔊 Âm thanh: Bật
            </button>

        </div>

    </main>

    <!-- Hộp kết quả -->
    <div class="result-modal" id="resultModal">

        <div class="result-content">

            <h2>🎉 Hoàn thành!</h2>

            <div id="finalResult"></div>

            <button id="playAgainBtn">
                🔄 Chơi lại
            </button>

        </div>

    </div>

    <!-- Thư viện âm thanh dùng chung phải tải trước game.js -->
    <script src="../../00_SHARED_ASSETS/SoundManager.js?v=2"></script>

    <!-- Mã trò chơi -->
    <script src="game.js?v=4"></script>

</body>
</html>
